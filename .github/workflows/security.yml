name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Audit Composer lockfile
        run: docker run --rm --mount "type=bind,src=$PWD,dst=/app,readonly" -w /app -e COMPOSER_HOME=/tmp/composer composer:2 audit --locked --no-interaction

      - name: Audit npm lockfile
        run: docker run --rm --mount "type=bind,src=$PWD,dst=/app,readonly" -w /app node:22 npm audit --audit-level=high
